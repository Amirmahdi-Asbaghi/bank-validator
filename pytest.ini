# Pytest configuration for the bank-validator project.
#
# Discovered automatically by pytest when running from the project
# root. All settings here apply to every test in the tree — no need
# to pass them on the command line.

[pytest]

# Tell pytest-django which settings module to load. Required for any
# test that touches Django (models, ORM, DRF serializers).
DJANGO_SETTINGS_MODULE = config.settings

# File and class/function naming patterns. These are pytest's defaults,
# declared explicitly for clarity — a new contributor sees the
# convention without consulting pytest docs.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command-line flags:
#   -ra  show a summary of non-passing tests at the end
#   -q   quiet mode (less per-test verbosity)
addopts = -ra -q

# Only look for tests in the tests/ directory. Prevents pytest from
# wandering into the app folders looking for test_*.py files.
testpaths = tests
