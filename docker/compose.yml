name: bankval

services:
  # ---------- PostgreSQL (Django DB) ----------
  postgres:
    image: postgres:16-alpine
    container_name: bankval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Redis (Celery broker) ----------
  redis:
    image: redis:7-alpine
    container_name: bankval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


    # ---------- MinIO (S3-compatible object storage) ----------
  minio:
    image: quay.io/minio/minio:latest
    container_name: bankval-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- MinIO init (creates buckets on startup) ----------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: bankval-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/raw &&
      mc mb --ignore-existing local/curated &&
      mc mb --ignore-existing local/quarantine &&
      echo 'Buckets ready: raw, curated, quarantine' &&
      exit 0
      "

  # ---------- Django (web) ----------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: bankval-web:dev
    container_name: bankval-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ../.env
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- Celery worker (async tasks) ----------
  celery:
    image: bankval-web:dev
    container_name: bankval-celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: